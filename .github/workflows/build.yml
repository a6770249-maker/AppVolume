name: Build Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl sudo xz-utils unzip

      - name: Install Theos
        env:
          SHELL: /bin/bash
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build package
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make -j"$(nproc)" package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AppVolume-deb
          path: packages/*.deb
          if-no-files-found: error

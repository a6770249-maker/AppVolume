name: Build Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git xz-utils libtinfo6

      - name: Set up Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

          for i in $(seq 1 30); do
            if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/toolchain.tar.xz \
              https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz; then
              echo "toolchain downloaded on attempt $i"
              break
            fi
            echo "attempt $i failed, retrying in 10s"
            sleep 10
          done
          test -s /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain"

          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          "$THEOS/toolchain/linux/iphone/bin/ldid" -v 2>&1 | head -n1
          ls "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build package
        run: |
          make clean || true
          make -j"$(nproc)" package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AppVolume-deb
          path: packages/*.deb
          if-no-files-found: error
